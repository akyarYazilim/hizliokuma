version: '3.8'

services:
  hizliokuma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hizliokuma-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hizliokuma-network
    # Opsiyonel: Volume ile çalışmak istersen (data persistence)
    # volumes:
    #   - ./data:/app/.data

networks:
  hizliokuma-network:
    driver: bridge

# Docker Compose kullanımı:
# 
# İlk kez çalıştır:
#   docker-compose up --build
#
# Arka planda çalıştır:
#   docker-compose up -d --build
#
# Logları görüntüle:
#   docker-compose logs -f
#
# Durdur:
#   docker-compose down
#
# Rebuild et (değişikliklerden sonra):
#   docker-compose up -d --build
